[project]
name = "pdf2md"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "diskcache2~=1.0.0",
    "fastapi~=0.116.0",
    "httptools~=0.6.4",
    "msgspec~=0.19.0",
    "pdfminer-six[image]>=20240706",
    "promplate-recipes~=0.2.3",
    "promplate-trace[langfuse,langsmith]~=0.3.0.dev5",
    "promplate[openai]~=0.3.4",
    "promptools[tokenizer]~=0.1.3.5",
    "pymupdf~=1.26.0",
    "rich~=14.0.0",
    "ruff~=0.12.0",
    "uvicorn~=0.35.0",
    "uvicorn-hmr[all]~=0.0.7",
    "watchfiles~=1.1.0",
]

[tool.ruff]
line-length = 200

[tool.ruff.lint]
extend-select = [
    "F",    # flake8
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle
    "UP",   # pyupgrade
    "TRY",  # tryceratops
    "RUF",  # ruff
    "FURB", # refurb
    "C4",   # flake8-comprehensions
    "ARG",  # flake8-unused-arguments
    "PIE",  # flake8-pie
    "PTH",  # flake8-use-pathlib
    "RSE",  # flake8-raise
    "SIM",  # flake8-simplify
    "SLF",  # flake8-self
]

[tool.m.aliases]
dev = "uvicorn-hmr --reload"
fmt = { cmd = "ruff format && ruff check --fix --show-fixes", shell = true }

[tool.pyright]
typeCheckingMode = "standard"
